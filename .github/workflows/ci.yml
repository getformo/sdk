name: Formo SDK CI Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      # The CDN build is what a site pays for on every page load, so the
      # budget only means something if something checks it. Nothing did:
      # `size-limit` exits 1 when over, but no job ran it, so main sat over
      # the limit unnoticed (see #332, where it had drifted 9 kB past).
      - name: Check bundle size
        run: pnpm size

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # src/version.ts is generated by scripts/update-version.js during the npm
      # `version` lifecycle, and its value is compiled into the bundle and sent
      # as `library_version` on every event. When a release bumps package.json
      # without running that lifecycle, the file silently keeps its old value
      # and every event misreports which SDK produced it. That happened for
      # 1.31 through 1.33: all of them reported 1.30.1, leaving four releases
      # with no version visibility in analytics. The release workflow only
      # checks the git tag against package.json, so nothing caught it.
      - name: Verify src/version.ts matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # version.ts is TypeScript, so read the literal rather than importing.
          SRC_VERSION=$(grep -oE "version = '[^']+'" src/version.ts | sed "s/version = '//; s/'//")

          echo "package.json:   $PKG_VERSION"
          echo "src/version.ts: $SRC_VERSION"

          if [ -z "$SRC_VERSION" ]; then
            echo "::error::Could not read a version literal from src/version.ts"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$SRC_VERSION" ]; then
            echo "::error::src/version.ts ($SRC_VERSION) does not match package.json ($PKG_VERSION). Run 'node scripts/update-version.js' and commit src/version.ts."
            exit 1
          fi

          echo "Versions match: $PKG_VERSION"

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    needs: [build, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # Drives the BUILT bundle through the EIP-1193 path end to end and
      # asserts exact event lists per scenario, so a regression is caught
      # before it is published rather than a day after. The wagmi rows need
      # real wagmi, which is a peer dependency, so they run in the examples
      # repo against the published package.
      - name: Build
        run: pnpm build
      - name: End-to-end behaviours
        run: pnpm test:e2e

  # The EIP-1193 behaviours above run the built bundle in Node with a stub
  # provider. This job is the missing rung between that and the examples
  # repo: the same dist/index.umd.min.js served to a real headless Chrome,
  # wallets announced over EIP-6963, receipts mined by a real anvil. It
  # exercises the LOCAL build, so a bad change fails here on the PR rather
  # than in the examples repo a release later. No new dependencies: the
  # runner's preinstalled Chrome, Node's built-in WebSocket, and anvil.
  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm build

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Start anvil
        run: |
          anvil --port 8545 --chain-id 31337 --silent &
          for i in $(seq 1 50); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 >/dev/null && exit 0
            sleep 0.2
          done
          echo "anvil did not come up" >&2; exit 1

      - name: Browser end-to-end (EIP-6963, real receipts)
        run: pnpm test:browser

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
